<div class="relative min-h-screen overflow-hidden">

    <!-- Top-right corner accent -->

      <polygon points="220,0 60,0 220,120" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="0.75" opacity="0.3"/>
      <line x1="220" y1="60" x2="130" y2="60" stroke="#22d3ee" stroke-width="1" opacity="0.25"/>
      <circle cx="130" cy="60" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
      <circle cx="130" cy="60" r="1" fill="#22d3ee" opacity="0.7"/>

    <!-- Bottom-left corner accent -->
    <svg class="absolute bottom-0 left-0" width="220" height="180" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,180 160,180 0,60" fill="rgba(124,58,237,0.05)" stroke="#7c3aed" stroke-width="0.75" opacity="0.28"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke="#7c3aed" stroke-width="1" opacity="0.22"/>
      <circle cx="90" cy="120" r="2.5" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
      <circle cx="90" cy="120" r="1" fill="#7c3aed" opacity="0.7"/>
    </svg>

  </div>

  <!-- Page content -->
  <div class="relative z-10">
    <router-outlet />
  </div>
</div>
